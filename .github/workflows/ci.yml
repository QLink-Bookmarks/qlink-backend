name: Kotlin CI with Gradle and PostgreSQL

on:
  pull_request:
    branches:
      - main
      - release
      - "feat/**"
      - "refactor/**"
      - "fix/**"
      - "codex/**"

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lambda:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lambda/link-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lambda/link-preview/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run package
      - uses: hashicorp/setup-terraform@v4
      - name: Terraform dev 검증
        working-directory: terraform/dev
        run: |
          terraform init -backend=false -input=false
          terraform fmt -check -recursive
          terraform validate
      - name: Terraform prod 검증
        working-directory: terraform/prod
        run: |
          terraform init -backend=false -input=false
          terraform fmt -check -recursive
          terraform validate
      - name: Terraform Lambda dev 검증
        working-directory: terraform/lambda/dev
        run: |
          terraform init -backend=false -input=false
          terraform fmt -check -recursive
          terraform validate
      - name: Terraform Lambda prod 검증
        working-directory: terraform/lambda/prod
        run: |
          terraform init -backend=false -input=false
          terraform fmt -check -recursive
          terraform validate

  build:
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: corretto

      - name: Node.js 24 설치
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Linux Lambda ZIP 생성
        working-directory: lambda/link-preview
        run: npm run package

      - name: Gradle 캐싱
        uses: gradle/actions/setup-gradle@v4.4.0
        with:
          cache-read-only: "${{ github.event.repository != null && github.base_ref != github.event.repository.default_branch }}"

      - name: 빌드 권한 부여
        run: chmod +x gradlew

      - name: Spotless 적용
        run: ./gradlew spotlessApply

      - name: 프로젝트 빌드
        run: ./gradlew build

      - name: 자코코 리포트 작성
        uses: madrapps/jacoco-report@v1.6.1
        with:
          title: 📊 Jacoco Test Coverage
          paths: ${{ github.workspace }}/build/jacocoReports/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 50
          min-coverage-changed-files: 50
          update-comment: true

      - name: 테스트 리포트 작성
        uses: mikepenz/action-junit-report@v6
        if: success() || failure()
        with:
          report_paths: "**/build/test-results/test/TEST-*.xml"
          comment: "true"
          detailed_summary: "true"
          skip_success_summary: "true"
          follow_symlink: "true"
