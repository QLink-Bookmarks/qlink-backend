flyway:
  schema: alink_prod
  locations:
    - db/migration
http:
  cors:
    allowCredentials: true
    allowNonSimpleContentTypes: true
    anyHost: false
    hosts:
      - archivelink.app
      - api.archivelink.app
linkContent:
  lambdaFunction: alink-link-content-prod:live
worker:
  linkContent:
    enabled: false
